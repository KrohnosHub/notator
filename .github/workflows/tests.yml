# Bei jedem Push nach main und bei jedem Pull Request:
# index.html aus src/ gebaut? gd-core aktuell und getestet? Build-Nummer höher als auf main? Bildvergleich (nur Hinweis).
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: index.html passt zu src/?
        run: |
          python3 build.py --check || { echo "::error::index.html passt nicht zu src/ – Änderungen in src/ machen und python3 build.py ausführen. Wurde index.html direkt bearbeitet, dann python3 tools/split.py"; exit 1; }
      - name: Keine Inline-Handler, Handler-Datei aktuell? (Content-Security-Policy)
        run: python3 tools/handlers.py --check
      - name: gd-core aktuell?
        run: python3 tools/gd-core-sync.py --check
      - name: gd-core-Tests
        run: node tests/gd-core.test.js
      - name: Build-Nummer und Cache-Version höher als auf dem Ziel-Branch? (nur bei Pull Requests)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 tools/check-version.py "origin/${{ github.base_ref }}"
      - name: Playwright installieren (für den Bildvergleich)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      # Bildvergleich gegen den Ziel-Branch, auf derselben Maschine gerendert (gleiche Schriften/Kantenglättung):
      # meldet nur Änderungen am Notenbild, die dieser PR verursacht. Gewollte Änderungen sind erlaubt,
      # deshalb nur als Hinweis (nicht blockierend); Bericht unter «Artifacts» und in der Zusammenfassung.
      - name: Bildvergleich gegen den Ziel-Branch (Hinweis, nicht blockierend)
        id: visual
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add "$RUNNER_TEMP/ziel" FETCH_HEAD
          VISUAL_ROOT="$RUNNER_TEMP/ziel" VISUAL_BASELINE="$RUNNER_TEMP/referenz" node tests/visual/run.js --update
          VISUAL_BASELINE="$RUNNER_TEMP/referenz" node tests/visual/run.js | tee "$RUNNER_TEMP/visual.txt"
      - name: Bildvergleich-Zusammenfassung
        if: always() && steps.visual.outcome != 'skipped'
        run: |
          { echo '### Bildvergleich gegen den Ziel-Branch'; echo '```'; cat "$RUNNER_TEMP/visual.txt" 2>/dev/null || echo '(kein Ergebnis)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Bildvergleich-Bericht hochladen
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bildvergleich
          path: |
            tests/visual/diff/
            ${{ runner.temp }}/referenz/
